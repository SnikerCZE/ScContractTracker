name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Workflow jen čte kód – token GitHubu nemá žádná práva zápisu.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ScContractTracker.sln

      - name: Build
        run: dotnet build ScContractTracker.sln -c Release --no-restore -p:RepositoryUrl=https://github.com/${{ github.repository }}

      - name: Test
        run: dotnet test tests/ScContractTracker.Core.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
